<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>LABA</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=0.16.0">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar shell">
    <a class="brand" href="/" aria-label="LABA — головна">
      <span class="brand-mark">L</span>
      <span><strong>LABA</strong><small>РОБОЧИЙ ПРОСТІР</small></span>
    </a>
    <div class="identity">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="identity-name">Перевіряємо доступ…</span>
      <a id="admin-link" class="button button-ghost hidden" href="/admin">Адмінпанель</a>
    </div>
  </header>

  <main class="shell module-home">
    <section class="module-heading">
      <p class="eyebrow">ОБЕРІТЬ РОЗДІЛ</p>
      <h1>Лабораторія</h1>
    </section>
    <section id="module-grid" class="module-grid" aria-live="polite">
      <article class="module-card skeleton"></article>
      <article class="module-card skeleton"></article>
      <article class="module-card skeleton"></article>
    </section>
    <section id="module-empty" class="empty-state hidden">
      <h2>Немає доступних розділів</h2>
      <p>Зверніться до головного адміністратора.</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/assets/home.js?v=0.16.0"></script>
</body>
</html>
