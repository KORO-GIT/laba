<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>LABA — центр пристроїв</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=0.3.3">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar shell">
    <a class="brand" href="/" aria-label="LABA — головна">
      <span class="brand-mark">L</span>
      <span><strong>LABA</strong><small>КЕРУВАННЯ ПРИСТРОЯМИ</small></span>
    </a>
    <div class="identity">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="identity-name">Перевіряємо доступ…</span>
      <a id="admin-link" class="button button-ghost hidden" href="/admin">Адмінпанель</a>
    </div>
  </header>

  <main class="shell">
    <section class="toolbar" aria-label="Фільтри пристроїв">
      <div class="tabs" role="tablist">
        <button class="tab active" data-filter="all" type="button">Усі</button>
        <button class="tab" data-filter="printer" type="button">Принтери</button>
        <button class="tab" data-filter="camera" type="button">Камери</button>
      </div>
      <button id="refresh" class="button button-ghost" type="button">Оновити</button>
    </section>

    <section id="device-grid" class="device-grid" aria-live="polite">
      <article class="device-card skeleton"></article>
      <article class="device-card skeleton"></article>
    </section>

    <section id="empty-state" class="empty-state hidden">
      <span class="empty-glyph">＋</span>
      <h2>Тут поки порожньо</h2>
      <p>Адміністратор може додати принтер або камеру в розділі керування.</p>
    </section>
  </main>

  <footer class="shell footer">
    <span>LABA / ПРИВАТНА МЕРЕЖА</span>
    <span>Захищено Cloudflare Access + Tailscale</span>
  </footer>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/assets/dashboard.js?v=0.3.3"></script>
</body>
</html>
